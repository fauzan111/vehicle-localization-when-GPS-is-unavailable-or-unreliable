dataset:
  name: nuScenes mini + CAN bus expansion
  scene: scene-0061
  can_bus_directory: can_bus
streams:
  imu:
    message: ms_imu
    rate_hz: 100
    yaw_rate_component: rotation_rate[2]
  wheel_speed:
    message: zoe_veh_info
    rate_hz: 100
    source: mean_of_FL_FR_RL_RR_wheel_speeds
    unit: rpm
    wheel_radius_m: 0.305
  reference_pose:
    message: pose
    rate_hz: 50
    fields: [pos, orientation]
    role: evaluation_ground_truth_only
  gnss:
    source: synthetic_measurement_from_reference_pose
    role: estimator_input_when_available
    noise_std_m: 1.0
    update_rate_hz: 1.0
    outages_s: [[5.0, 10.0], [12.0, 17.0]]
filter_noise:
  wheel_speed_std_mps: 0.12
  gyro_rate_std_rps: 0.01
  camera:
    translation_noise_std_m: 0.025
    heading_noise_std_rad: 0.004
evaluation:
  note: >-
    GPS observations are simulated from the reference pose and masked during outages;
    they are not raw GNSS receiver measurements from nuScenes.
  local_frame: origin_at_first_reference_pose
