[project]
name = "gps-denied-vehicle-localization"
version = "0.1.0"
description = "Camera, IMU, wheel-speed, and intermittent-GNSS localization benchmark."
readme = "README.md"
requires-python = ">=3.11,<3.13"
dependencies = ["numpy>=1.26", "pyyaml>=6.0"]

[dependency-groups]
dev = ["ruff>=0.6"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/gps_denied_localization"]

[tool.ruff]
line-length = 100
target-version = "py311"
extend-exclude = ["data/generated"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
